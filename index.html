<script>try { if (localStorage.getItem('orbitshow-service') === 'disney') { document.documentElement.dataset.service = 'disney'; document.querySelector('meta[name="theme-color"]').content = '#040714'; } } catch (e) { /* storage unavailable: Netflix theme */ }</script>

<body>
<div id="splash" class="splash" aria-hidden="true"><div class="splash-lockup"><p class="splash-tagline">The world's favorite <span>screen</span></p><img src="./assets/icon-512.png" alt="" width="120" height="120"><span class="splash-wordmark brand"><span>orbitshow<span class="brand-dot">.</span></span></span></div></div>
<script>
// Keep in sync with i18n.js: ?lang=xx, then the language saved in Options, then the first supported device language.
(function () {
  var supported = ['en', 'ko', 'ja', 'zh', 'es', 'fr', 'de'];
  var lines = {
    en: ["The world's favorite ", 'screen'],
    ko: ['세계가 가장 좋아하는 ', '스크린'],
    ja: ['世界が最も愛する', 'スクリーン'],
    zh: ['全世界最爱的', '荧幕'],
    es: ['La pantalla ', 'favorita del mundo'],
    fr: ['L’écran ', 'préféré du monde'],
    de: ['Der Lieblingsbildschirm ', 'der Welt']
  };
  var forced = (location.search.match(/[?&]lang=([a-z]{2})(?:&|$)/) || [])[1];
  var saved = null;
  try { saved = localStorage.getItem('orbitshow-lang'); } catch (e) { /* storage unavailable */ }
  var prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
  var lang = supported.indexOf(forced) >= 0 ? forced : supported.indexOf(saved) >= 0 ? saved : 'en';
  if (supported.indexOf(forced) < 0 && supported.indexOf(saved) < 0) {
    for (var i = 0; i < prefs.length; i++) {
      var code = String(prefs[i]).toLowerCase().split('-')[0];
      if (supported.indexOf(code) >= 0) { lang = code; break; }
    }
  }
  document.documentElement.lang = lang;
  var tagline = document.querySelector('.splash-tagline');
  tagline.textContent = lines[lang][0];
  var accent = document.createElement('span');
  accent.textContent = lines[lang][1];
  tagline.appendChild(accent);
})();
</script>

sform="rotate(-10) scale(.115) translate(-246 -130)"><use href="#demo-hand" fill="none" stroke="#000" stroke-opacity=".55" stroke-width="14" stroke-linejoin="round"/><use href="#demo-hand" fill="#fff" stroke="none"/></g></g></g><g transform="translate(23 -22) scale(1.45)"><g class="demo-bang" fill="#fff" stroke="none"><rect x="-3.3" y="-11" width="6.6" height="14.5" rx="3.3"/><circle cy="9" r="3.7"/></g></g></svg><p class="intro-world" data-i18n="ui.introWorld">Pinch in to see the World Rank.</p></div><div class="globe-loading" id="globe-loading" data-i18n="ui.globeLoading">Loading the globe…</div></div>
