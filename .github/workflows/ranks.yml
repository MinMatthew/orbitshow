name: Update rankings

on:
  schedule:
    # Netflix publishes the weekly Top 10 on Tuesdays; a daily run also picks up late fixes and keeps TMDb ratings fresh.
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ranks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Netflix Top 10
        run: python3 scripts/fetch_netflix.py
      - name: Fetch Disney+ approximate ranking
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 scripts/fetch_disney.py
      - name: Match TMDb metadata
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 scripts/fetch_tmdb.py
      - name: Merge into ranks/
        run: python3 scripts/build_ranks.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data ranks
          if git diff --cached --quiet; then
            echo "No ranking changes"
          else
            git commit -m "chore: update rankings"
            git push
          fi
